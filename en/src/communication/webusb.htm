<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebUSB test page</title>
</head>
<body>
<div align="center">
    <button id="usbConnectBtn">Open USB device</button>
    <button id="beepBtn" disabled>Beep</button>
</div>
<textarea id="logArea" rows="40" cols="120" readonly></textarea>
<div align="center" style="color: #2A2A2A;"><small>LEGO® is a trademark of the LEGO Group of companies which does not sponsor, authorize or endorse this site.</small></div>
<script type="text/javascript" src="rcxCommon.js"></script>
<script type="text/javascript" src="rcxUsb.js"></script>
<script type="text/javascript">
  // Minimal test of the USB tower connection: open the tower, talk to the RCX and let it beep.
  const usbConnectBtn = document.getElementById('usbConnectBtn');
  const beepBtn = document.getElementById('beepBtn');
  let usbConnected = false;

  usbConnectBtn.addEventListener('click', async () => {
    if(!usbConnected) {
      usbConnected = await usbConnect();
      if(usbConnected) {
        if(await ping()) {
          showInfoMsg("🔗 Communication working, RCX is alive!");
          await checkFirmware();
          await checkBatteryLevel();
        } else {
          showErrorMsg("No communication with RCX possible.");
        }
      }
    } else {
      await usbDisconnect();
      usbConnected = false;
    }
    usbConnectBtn.innerHTML = usbConnected ? 'Close USB device' : 'Open USB device';
    beepBtn.disabled = !usbConnected;
  });

  beepBtn.addEventListener('click', async () => {
    const {success, payload} = await playSystemSound(SystemSound.FastSweepUp);
    showInfoMsg(success ? "🎵 Played system sound." : "Unable to play system sound.");
  });
</script>
</body>
</html>
